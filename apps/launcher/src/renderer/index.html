<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; media-src 'none'"
    />
    <title>Cursor Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="card">
      <div id="bar">
        <button id="folder-btn" class="icon" title="Choisir un dossier à organiser (ou glissez-le ici)" aria-label="Choisir un dossier">📁</button>
        <div id="folder-chip" hidden><span id="folder-name"></span><button id="folder-clear" aria-label="Retirer le dossier">×</button></div>
        <input id="prompt" type="text" autocomplete="off" spellcheck="false" placeholder="Que puis-je faire pour vous ?" />
        <button id="mic-btn" class="icon" title="Dictée vocale (clic pour démarrer/arrêter)" aria-label="Dictée vocale">🎙</button>
        <button id="settings-btn" class="icon" title="Réglages" aria-label="Réglages">⚙</button>
      </div>
      <div id="hint" hidden></div>
      <div id="progress" hidden>
        <div id="bar-track"><div id="bar-fill"></div></div>
        <div id="progress-text"></div>
      </div>
      <section id="output" hidden></section>
      <section id="plan" hidden></section>
      <section id="settings" hidden></section>
      <div id="confirm" hidden role="dialog" aria-modal="true">
        <h2 id="confirm-title"></h2>
        <pre id="confirm-detail"></pre>
        <div class="row">
          <button id="confirm-no">Refuser (Échap)</button>
          <button id="confirm-yes" class="primary">Autoriser</button>
        </div>
      </div>
    </main>
    <script src="renderer.js" defer></script>
  </body>
</html>
