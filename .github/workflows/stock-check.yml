name: Stock iPhone Duo — vérification planifiée

# Free scheduler for the Vercel Hobby plan (Vercel Cron is limited to one run per day there).
# Requires repository secrets STOCK_CHECK_URL (https://<domaine>/api/cron/stock-check) and CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the stock-check endpoint
        env:
          STOCK_CHECK_URL: ${{ secrets.STOCK_CHECK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STOCK_CHECK_URL" ]; then
            echo "STOCK_CHECK_URL is not set, skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$STOCK_CHECK_URL" | head -c 2000
